name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # onnxruntime-node downloads CUDA binaries on Linux x64 during postinstall.
  # The release asset it asks for answers 404, and CI never uses the GPU.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # The visual QA unit tests photograph real pages with Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:e2e

      # Subscription-backed live agents are intentionally opt-in and never run in CI.
